apply plugin: "com.android.library"

android {
    namespace "dev.gubenkov.reading"
    compileSdk 34
    defaultConfig { minSdk 26 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // ORT с QNN EP; тянет com.qualcomm.qti:qnn-runtime (HTP v68…v81: Xiaomi 13 Lite = v69, S26 Ultra = v81)
    api "com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0"
}
dependencies { testImplementation "junit:junit:4.13.2" }
