apply plugin: "com.android.application"

android {
    namespace "dev.gubenkov.readbench"
    compileSdk 34
    defaultConfig {
        applicationId "dev.gubenkov.readbench"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies { implementation project(":reading") }
